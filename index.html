<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Grammar Handbook for English learners with searchable topics, examples, and quizzes">
    <title>Grammar Handbook - English Structure</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1 id="appTitle"></h1>
            <p class="subtitle" id="appSubtitle"></p>
            <div class="language-toggle" id="languageToggle">
                <button class="btn btn-secondary" type="button" data-lang="en">EN</button>
                <button class="btn btn-secondary" type="button" data-lang="fa">FA</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Sidebar with topic list -->
            <aside class="sidebar" id="sidebar">
                <div class="search-container">
                    <input 
                        type="search" 
                        id="searchInput" 
                        placeholder="" 
                        aria-label=""
                    />
                </div>

                <div class="category-filter">
                    <label for="categorySelect" id="categoryFilterLabel"></label>
                    <select id="categorySelect">
                    </select>
                </div>

                <nav class="topics-list" id="topicsList" role="navigation" aria-label="Grammar topics">
                    <!-- Topics will be dynamically inserted here -->
                </nav>
            </aside>

            <!-- Topic Detail View -->
            <section class="topic-detail" id="topicDetail">
                <div class="empty-state">
                    <h2 id="emptyStateTitle"></h2>
                    <p id="emptyStateSubtitle"></p>
                </div>

                <div class="topic-content" id="topicContent" style="display: none;">
                    <!-- Topic header -->
                    <div class="topic-header">
                        <h2 id="topicTitle"></h2>
                        <div class="topic-meta">
                            <span class="topic-category" id="topicCategory"></span>
                            <div class="topic-tags" id="topicTags"></div>
                        </div>
                    </div>

                    <!-- Accordion Sections -->
                    <div class="accordion">
                        <!-- Summary -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="true">
                                <span class="accordion-icon">📋</span>
                                <span id="sectionSummaryLabel"></span>
                                <span class="accordion-toggle">−</span>
                            </button>
                            <div class="accordion-content active">
                                <p id="summaryContent"></p>
                            </div>
                        </div>

                        <!-- Rules -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false">
                                <span class="accordion-icon">📐</span>
                                <span id="sectionRulesLabel"></span>
                                <span class="accordion-toggle">+</span>
                            </button>
                            <div class="accordion-content">
                                <ul id="rulesContent"></ul>
                            </div>
                        </div>

                        <!-- Examples -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false">
                                <span class="accordion-icon">💡</span>
                                <span id="sectionExamplesLabel"></span>
                                <span class="accordion-toggle">+</span>
                            </button>
                            <div class="accordion-content">
                                <ul id="examplesContent"></ul>
                            </div>
                        </div>

                        <!-- Common Mistakes -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false">
                                <span class="accordion-icon">⚠️</span>
                                <span id="sectionMistakesLabel"></span>
                                <span class="accordion-toggle">+</span>
                            </button>
                            <div class="accordion-content">
                                <div id="mistakesContent"></div>
                            </div>
                        </div>

                        <!-- Quiz -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false">
                                <span class="accordion-icon">✏️</span>
                                <span id="sectionQuizLabel"></span>
                                <span class="accordion-toggle">+</span>
                            </button>
                            <div class="accordion-content">
                                <div id="quizContent"></div>
                            </div>
                        </div>

                        <!-- My Notes -->
                        <div class="accordion-item">
                            <button class="accordion-header" aria-expanded="false">
                                <span class="accordion-icon">📝</span>
                                <span id="sectionNotesLabel"></span>
                                <span class="accordion-toggle">+</span>
                            </button>
                            <div class="accordion-content">
                                <div class="notes-section">
                                    <h4 id="notesTitle"></h4>
                                    <textarea 
                                        id="notesTextarea" 
                                        placeholder=""
                                        rows="4"
                                    ></textarea>
                                    <button id="saveNotesBtn" class="btn btn-primary"></button>
                                    
                                    <h4 id="mistakesTitle"></h4>
                                    <textarea 
                                        id="mistakesTextarea" 
                                        placeholder=""
                                        rows="4"
                                    ></textarea>
                                    <button id="saveMistakesBtn" class="btn btn-primary"></button>

                                    <div class="notes-info">
                                        <small id="notesInfo"></small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Mobile Menu Toggle -->
        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
            ☰
        </button>

        <!-- Footer -->
        <footer class="app-footer">
            <p id="appFooter"></p>
        </footer>
    </div>

    <!-- Load data and app -->
    <script src="data/grammar-topics.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
